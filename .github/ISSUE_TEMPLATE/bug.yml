name: Bug
description: Something does not work as documented
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead. Paste error text in a code block.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, .NET SDK version and database.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines with secrets removed.
      render: text
