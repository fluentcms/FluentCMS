version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["type:chore", "area:build"]
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    labels: ["type:chore", "area:build"]
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
