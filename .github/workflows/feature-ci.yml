name: Feature CI

on:
  pull_request:
    branches: ["feature/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The diagnostic log of each test app, written as it goes so that it survives a cancelled job, holds xUnit.net's report
# of a test that runs too long and the stack of a test that --timeout cancelled.
env:
  TESTINGPLATFORM_DIAGNOSTIC: 1
  TESTINGPLATFORM_DIAGNOSTIC_VERBOSITY: Information
  TESTINGPLATFORM_DIAGNOSTIC_OUTPUT_DIRECTORY: ${{ github.workspace }}/artifacts/test-results
  TESTINGPLATFORM_DIAGNOSTIC_SYNCHRONOUS_WRITE: 1

jobs:
  markdown:
    name: Feature markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  fast-checks:
    # Separate names keep these checks from satisfying main's full-suite requirements.
    name: Fast checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      # Compile the whole solution, including the tests deferred to full CI.
      - name: Restore
        run: dotnet restore

      # dotnet list exits 0 even when it finds a vulnerable package, so fail on its report.
      - name: Check vulnerable packages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet list FluentCMS.slnx package --vulnerable --include-transitive | tee "$RUNNER_TEMP/vulnerable-packages.txt"
          if grep -q "has the following vulnerable packages" "$RUNNER_TEMP/vulnerable-packages.txt"; then
            echo "::error::Vulnerable NuGet packages found. Update them in Directory.Packages.props."
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      # Each --timeout is well past the slowest healthy run of its tests, so a hang ends with time left to name its tests.
      - name: Test SDK
        run: dotnet test --project tests/FluentCMS.Sdk.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results --timeout 5m

      - name: Test core units
        run: dotnet test --project tests/FluentCMS.Core.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results --timeout 5m

      - name: Test architecture
        run: dotnet test --project tests/FluentCMS.Architecture.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results --timeout 5m

      # The tool, and the host's commands with export and import on SQLite, so that a crash of either shows before full CI.
      - name: Test the tool
        run: dotnet test --project tests/FluentCMS.Cli.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results --timeout 5m

      # The test projects ignore exit code 8, zero tests, so a filter that matched nothing would pass without a minimum.
      - name: Test the commands
        run: dotnet test --project tests/FluentCMS.Core.IntegrationTests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results --filter-namespace "FluentCMS.Core.IntegrationTests.Commands*" --minimum-expected-tests 40 --timeout 5m

      - name: Name the tests that were running
        if: failure() || cancelled()
        shell: bash
        run: grep -h -A6 -e "\[Long Running Test\]" -e "\[FAIL\]" artifacts/test-results/*.diag 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: feature-test-results-${{ matrix.os }}
          path: artifacts/test-results
          retention-days: 14
