name: Compose

# The compose file of the reference host, src/FluentCMS.Host/compose.yaml, with a smoke test: the image, PostgreSQL, MinIO
# and the CLI together. It runs on pushes to feature branches and when dispatched; CI calls it on pushes to main and when
# dispatched there. Pull requests do not run it, but Publish calls it, on a pull request too, with the archive of the image it
# built and that image's digest, which the job loads instead of building one; Publish pushes that image only. A manual run with
# an image runs the published one instead of building it, such as ghcr.io/fluentcms/fluentcms:1.0.0-preview.1 after a release
# (docs/releasing.md); the image must be public. Beside the smoke test, the admin's end-to-end tests run against the image,
# built or published, except when Publish calls the workflow with an archive.
on:
  push:
    branches: ["feature/**"]
  workflow_dispatch:
    inputs:
      image:
        description: A published image to run instead of building one, such as ghcr.io/fluentcms/fluentcms:1.0.0-preview.1.
        type: string
        default: ""
  workflow_call:
    inputs:
      image:
        type: string
        default: ""
      # The artifact of the calling run that holds image.tar, the OCI archive of the image; image names it by its digest.
      archive:
        type: string
        default: ""
    outputs:
      digest:
        description: The ID of the image the smoke test ran, which with an archive is the digest of its index.
        value: ${{ jobs.smoke.outputs.digest }}

permissions:
  contents: read

jobs:
  smoke:
    name: Compose smoke test (PostgreSQL and MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # At job level: a called workflow shares the caller's workflow name, so a workflow-level group would hold CI's own. A run
    # on main, which publish needs, a release of a tag and a manual run have a group of their own and are never cancelled.
    concurrency:
      group: compose-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
    outputs:
      digest: ${{ steps.ran.outputs.digest }}
    defaults:
      run:
        shell: bash
        working-directory: src/FluentCMS.Host
    env:
      BASE: http://localhost:8080
      BUILDKIT_PROGRESS: plain
      FLUENTCMS_IMAGE: ${{ inputs.image || 'fluentcms' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Refuse to start without the values of .env
        run: |
          refused() {
            if docker compose up -d --no-build 2> "$RUNNER_TEMP/refusal.txt"; then
              echo "::error::docker compose started $1"
              exit 1
            fi
            cat "$RUNNER_TEMP/refusal.txt"
            grep -q "in .env (see .env.example)" "$RUNNER_TEMP/refusal.txt"
          }
          refused "with no .env"
          cp .env.example .env
          refused "with the example's empty values"
          rm .env

      # Throwaway values in place of the example's empty ones. The override stands in for the proxy that ends TLS, which
      # sign-in needs: the runner reaches the host through the network's gateway and forwards the scheme. It also registers
      # a public client to sign the administrator in with, and turns the admin on.
      - name: Write .env with throwaway values
        run: |
          : > .env
          while IFS= read -r line; do
            case "$line" in
              FLUENTCMS_*=)
                value=$(openssl rand -hex 10)
                echo "::add-mask::$value"
                echo "$line$value" >> .env
                ;;
              *) echo "$line" >> .env ;;
            esac
          done < .env.example
          cat > "$RUNNER_TEMP/compose.ci.yaml" <<'YAML'
          services:
            cms:
              environment:
                FluentCms__ReverseProxy__ForwardedHeaders__Enabled: "true"
                FluentCms__ReverseProxy__ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
                FluentCms__ReverseProxy__ForwardedHeaders__KnownNetworks__1: 192.168.0.0/16
                FluentCms__Clients__Applications__smoke__RedirectUris__0: https://localhost/signed-in
                FluentCms__Clients__Applications__smoke__Scopes__0: openid
                FluentCms__Clients__Applications__smoke__Scopes__1: management
                FluentCms__Admin__Enabled: "true"
                FluentCms__Security__AllowGeneratedSigningKey: "true"
                FluentCms__Security__AllowUnencryptedKeyRing: "true"
          YAML
          echo "COMPOSE_FILE=compose.yaml:$RUNNER_TEMP/compose.ci.yaml" >> "$GITHUB_ENV"

      # After .env: compose interpolates the whole file for any command, a build included.
      - name: Build the image
        if: ${{ !inputs.image }}
        run: docker compose build cms

      - name: Pull the published image
        if: ${{ inputs.image && !inputs.archive }}
        run: docker compose pull cms

      - name: Download the image archive
        if: ${{ inputs.archive }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.archive }}
          path: ${{ runner.temp }}/image

      - name: Load the image archive
        if: ${{ inputs.archive }}
        run: ../../eng/load-image.sh "$RUNNER_TEMP/image/image.tar" "$FLUENTCMS_IMAGE"

      - name: Start
        run: docker compose up -d --no-build

      - name: Wait until the host is ready
        run: |
          if ! timeout 240 sh -c 'until curl -fsS -4 --max-time 10 -o /dev/null "$BASE/health/ready"; do sleep 3; done'; then
            echo "::error::The host was not ready within 240 seconds."
            exit 1
          fi

      - name: Check that migrate and schema apply ran before the host
        run: |
          for step in minio-init migrate schema-apply; do
            code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq "$step")")
            [ "$code" = 0 ] || { echo "::error::$step exited with $code"; exit 1; }
          done
          docker compose logs --no-log-prefix migrate | tee "$RUNNER_TEMP/migrate.txt"
          grep -q "^Applied " "$RUNNER_TEMP/migrate.txt"
          docker compose logs --no-log-prefix schema-apply | tee "$RUNNER_TEMP/schema-apply.txt"
          grep -q "^Applied .*the schema history records schema" "$RUNNER_TEMP/schema-apply.txt"
          finished=$(docker inspect -f '{{.State.FinishedAt}}' "$(docker compose ps -aq schema-apply)")
          started=$(docker inspect -f '{{.State.StartedAt}}' "$(docker compose ps -q cms)")
          echo "schema apply finished at $finished, the host started at $started"
          [ "$(date -d "$finished" +%s%N)" -lt "$(date -d "$started" +%s%N)" ]

      # The image the three services ran, which Publish compares with the one it pushes. With an archive it must be the digest
      # the job was given, so that a dry run fails where a release would.
      - name: Record the image that ran
        id: ran
        env:
          ARCHIVE: ${{ inputs.archive }}
        run: |
          digest=$(docker inspect -f '{{.Image}}' "$(docker compose ps -q cms)")
          for step in migrate schema-apply; do
            ran=$(docker inspect -f '{{.Image}}' "$(docker compose ps -aq "$step")")
            [ "$ran" = "$digest" ] || { echo "::error::$step ran $ran, and the host $digest"; exit 1; }
          done
          if [ -n "$ARCHIVE" ] && [ "$digest" != "${FLUENTCMS_IMAGE##*@}" ]; then
            echo "::error::The services ran $digest, and the archive holds $FLUENTCMS_IMAGE."
            exit 1
          fi
          echo "The services ran $FLUENTCMS_IMAGE, whose ID is $digest." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The licence and the third-party notices sit in the application folder (#3215). The image has no shell, so they are copied
      # out of the running container.
      - name: Check that the image carries the licence and the third-party notices
        run: |
          for file in LICENSE THIRD-PARTY-NOTICES.md; do
            docker compose cp "cms:/app/$file" "$RUNNER_TEMP/$file"
            [ -s "$RUNNER_TEMP/$file" ] || { echo "::error::/app/$file is missing or empty in the image"; exit 1; }
          done
          grep -q "^# MIT License" "$RUNNER_TEMP/LICENSE" || { echo "::error::/app/LICENSE does not hold the MIT licence"; exit 1; }
          grep -q "Project Nayuki" "$RUNNER_TEMP/THIRD-PARTY-NOTICES.md" || { echo "::error::/app/THIRD-PARTY-NOTICES.md does not hold the notice of Project Nayuki"; exit 1; }

      - name: Make the administrator and a management key with the CLI
        run: |
          password="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          printf '%s' "$password" > "$RUNNER_TEMP/admin-password"
          docker compose run --rm -T --no-deps cms fluentcms user create --email admin@example.com --role "Super Admin" --password-stdin < "$RUNNER_TEMP/admin-password"
          key=$(docker compose run --rm -T --no-deps cms fluentcms apikey create --name ci --class management --role "Super Admin" | tr -d '\r')
          echo "::add-mask::$key"
          [ -n "$key" ] && [ "$(printf '%s\n' "$key" | wc -l)" = 1 ] || { echo "::error::apikey create printed more than the key"; exit 1; }
          echo "MANAGEMENT_KEY=$key" >> "$GITHUB_ENV"

      - name: Smoke test
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/cookies"; hdr="$RUNNER_TEMP/headers"; body="$RUNNER_TEMP/body"
          : > "$jar"

          # A browser behind the proxy: https is forwarded, cookies are kept by name, and redirects are followed by hand.
          call() {
            local args=(-H "X-Forwarded-Proto: https" -H "X-Forwarded-For: 203.0.113.10") line
            if [ -s "$jar" ]; then args+=(-H "Cookie: $(paste -sd ';' "$jar" | sed 's/;/; /g')"); fi
            status=$(curl -sS -4 --max-time 30 -o "$body" -D "$hdr" -w '%{http_code}' "${args[@]}" "$@")
            while IFS= read -r line; do
              awk -v name="${line%%=*}=" 'index($0, name) != 1' "$jar" > "$jar.new"
              mv "$jar.new" "$jar"
              if [ -n "${line#*=}" ]; then echo "$line" >> "$jar"; fi
            done < <(tr -d '\r' < "$hdr" | sed -n 's/^[Ss]et-[Cc]ookie: *\([^;]*\).*/\1/p')
            return 0
          }
          expect() {
            if [ "$status" != "$1" ]; then
              echo "::error::$2 answered $status, expected $1"
              head -c 2000 "$body"; echo
              exit 1
            fi
          }
          location() { tr -d '\r' < "$hdr" | sed -n 's/^[Ll]ocation: *//p' | sed -E 's#^https?://[^/]+##'; }
          json() { call -H "Content-Type: application/json" "$@"; }
          key=(-H "Authorization: ApiKey $MANAGEMENT_KEY")

          # PostgreSQL, the bucket and the Blog sample.
          call "${key[@]}" "$BASE/api/management/v1/system/diagnostics"; expect 200 "The diagnostics"
          [ "$(jq -r '.dataProvider.provider' "$body")" = PostgreSQL ]
          [ "$(jq -r '.providerSlots[] | select(.slot == "FluentCMS.Media.IFileStorage") | .implementation' "$body")" = FluentCMS.Plugins.Media.S3.S3FileStorage ]

          # An article created and published with the management key, and read with a Delivery key.
          json "${key[@]}" -d '{"title":"Compose smoke test"}' "$BASE/api/management/v1/content/article"; expect 201 "Creating the article"
          article=$(jq -r '.id' "$body")
          call "${key[@]}" -X POST "$BASE/api/management/v1/content/article/$article/publish"; expect 200 "Publishing the article"
          json "${key[@]}" -d '{"name":"Compose smoke reader","grants":[{"permission":"content.article.read"}]}' "$BASE/api/management/v1/roles"; expect 201 "Creating the role"
          role=$(jq -r '.id' "$body")
          json "${key[@]}" -d "{\"name\":\"compose-smoke\",\"class\":\"delivery\",\"roleId\":\"$role\"}" "$BASE/api/management/v1/api-keys"; expect 201 "Creating the Delivery key"
          delivery_key=$(jq -r '.secret' "$body")
          echo "::add-mask::$delivery_key"
          delivery=(-H "Authorization: ApiKey $delivery_key")
          call "${delivery[@]}" "$BASE/api/delivery/v1/article/$article"; expect 200 "Reading the article"
          [ "$(jq -r '.title' "$body")" = "Compose smoke test" ]
          call "${delivery[@]}" "$BASE/api/delivery/v1/article/by/slug/welcome-to-fluentcms"; expect 200 "Reading the seeded article"
          { echo "ARTICLE_ID=$article"; echo "DELIVERY_KEY=$delivery_key"; } >> "$GITHUB_ENV"

          # The administrator signs in on the hosted login page and gets a token with PKCE.
          verifier=$(openssl rand -hex 32)
          challenge=$(printf '%s' "$verifier" | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          call -G "$BASE/connect/authorize" --data-urlencode client_id=smoke --data-urlencode response_type=code \
            --data-urlencode redirect_uri=https://localhost/signed-in --data-urlencode "scope=openid management" \
            --data-urlencode "code_challenge=$challenge" --data-urlencode code_challenge_method=S256 --data-urlencode state=smoke
          expect 302 "The authorization request"
          login=$(location)
          [[ "$login" == /account/login* ]]
          call "$BASE$login"; expect 200 "The login page"
          token=$(grep -o 'name="__RequestVerificationToken"[^>]*value="[^"]*"' "$body" | head -n 1 | sed 's/.*value="//; s/"$//')
          call "$BASE$login" --data-urlencode "Input.UserName=admin@example.com" --data-urlencode "Input.Password@$RUNNER_TEMP/admin-password" \
            --data-urlencode "__RequestVerificationToken=$token"
          expect 302 "Signing in"
          next=$(location)
          for _ in 1 2 3 4 5 6 7 8; do
            [[ "$next" == /signed-in* ]] && break
            call "$BASE$next"; expect 302 "Following $next"
            next=$(location)
          done
          [[ "$next" == /signed-in* ]] || { echo "::error::The sign-in did not come back to the client"; exit 1; }
          code=$(sed -n 's/.*[?&]code=\([^&]*\).*/\1/p' <<< "$next")
          code=$(printf '%b' "${code//%/\\x}")
          call "$BASE/connect/token" --data-urlencode grant_type=authorization_code --data-urlencode "code=$code" \
            --data-urlencode redirect_uri=https://localhost/signed-in --data-urlencode client_id=smoke --data-urlencode "code_verifier=$verifier"
          expect 200 "The token request"
          access=$(jq -r '.access_token' "$body")
          echo "::add-mask::$access"
          admin=(-H "Authorization: Bearer $access")

          # An image uploaded by the administrator, stored in the bucket and served back as it was sent.
          base64 -d > "$RUNNER_TEMP/smoke.png" <<< 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='
          call "${admin[@]}" -F "files=@$RUNNER_TEMP/smoke.png;type=image/png" "$BASE/api/management/v1/media"; expect 201 "Uploading the image"
          asset=$(jq -r '.items[0].id' "$body")
          docker compose exec -T minio sh -ec 'mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" > /dev/null; mc ls --recursive local/fluentcms-media' \
            | tee "$RUNNER_TEMP/bucket.txt"
          grep -q "${asset//-/}/original.png" "$RUNNER_TEMP/bucket.txt"
          call "${admin[@]}" -X POST "$BASE/api/management/v1/media/$asset/download-url"; expect 200 "The download URL"
          url=$(jq -r '.url' "$body" | sed -E 's#^https?://[^/]+##')
          call "$BASE$url"; expect 200 "Reading the image back"
          [ "$(sha256sum < "$body")" = "$(sha256sum < "$RUNNER_TEMP/smoke.png")" ]
          # The admin at /admin: the page with its base set and its policy, config.json from the host, a fingerprinted file of
          # the framework cached for good and in Brotli, and the admin client signing the administrator in with PKCE.
          call "$BASE/admin/"; expect 200 "The admin page"
          grep -q '<base href="/admin/" />' "$body"
          tr -d '\r' < "$hdr" | grep -qi "^cache-control: no-store$"
          tr -d '\r' < "$hdr" | grep -qi "^content-security-policy: default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; .*frame-ancestors 'none'$"
          call "$BASE/admin/system/components"; expect 200 "A client route of the admin"
          call "$BASE/admin/config.json"; expect 200 "The admin's config.json"
          [ "$(jq -r '.apiBaseUrl' "$body")" = https://localhost ]
          [ "$(jq -r '.authority' "$body")" = https://localhost/ ]
          [ "$(jq -r '.clientId' "$body")" = fluentcms-admin ]
          call "$BASE/admin/_framework/dotnet.js"; expect 200 "The admin's dotnet.js"
          wasm=$(grep -o 'dotnet\.native\.[a-z0-9]*\.wasm' "$body" | head -n 1)
          call -H "Accept-Encoding: br" "$BASE/admin/_framework/$wasm"; expect 200 "The admin's $wasm"
          tr -d '\r' < "$hdr" | grep -qi "^content-type: application/wasm$"
          tr -d '\r' < "$hdr" | grep -qi "^content-encoding: br$"
          tr -d '\r' < "$hdr" | grep -qi "^cache-control: .*immutable"
          callback=https://localhost/admin/authentication/login-callback
          call -G "$BASE/connect/authorize" --data-urlencode client_id=fluentcms-admin --data-urlencode response_type=code \
            --data-urlencode redirect_uri=$callback --data-urlencode "scope=openid profile email offline_access management" \
            --data-urlencode "code_challenge=$challenge" --data-urlencode code_challenge_method=S256 --data-urlencode state=admin
          expect 302 "The admin's authorization request"
          next=$(tr -d '\r' < "$hdr" | sed -n 's/^[Ll]ocation: *//p')
          [[ "$next" == "$callback?"* ]] || { echo "::error::The signed-in administrator was not sent back to the admin: $next"; exit 1; }
          code=$(sed -n 's/.*[?&]code=\([^&]*\).*/\1/p' <<< "$next")
          code=$(printf '%b' "${code//%/\\x}")
          call "$BASE/connect/token" --data-urlencode grant_type=authorization_code --data-urlencode "code=$code" \
            --data-urlencode redirect_uri=$callback --data-urlencode client_id=fluentcms-admin --data-urlencode "code_verifier=$verifier"
          expect 200 "The admin's token request"
          echo "The smoke test passed."

      # The same bounded wait as above, which fails the job when the host never becomes ready: with MinIO stopped, it must time out.
      - name: Check that the wait fails while the host is not ready
        run: |
          docker compose stop minio
          if timeout 30 sh -c 'until curl -fsS -4 --max-time 10 -o /dev/null "$BASE/health/ready"; do sleep 3; done'; then
            echo "::error::The host answered ready with MinIO stopped."
            exit 1
          fi
          curl -sS -4 --max-time 10 "$BASE/health/ready" || true
          echo

      - name: Check that a second up applies nothing and starts
        run: |
          docker compose down
          docker compose up -d --no-build
          if ! timeout 240 sh -c 'until curl -fsS -4 --max-time 10 -o /dev/null "$BASE/health/ready"; do sleep 3; done'; then
            echo "::error::The host was not ready within 240 seconds after the second up."
            exit 1
          fi
          docker compose logs --no-log-prefix migrate | tee "$RUNNER_TEMP/migrate.txt"
          grep -q "^Nothing to apply; every stream is up to date" "$RUNNER_TEMP/migrate.txt"
          docker compose logs --no-log-prefix schema-apply | tee "$RUNNER_TEMP/schema-apply.txt"
          grep -q "^Nothing to apply; the content tables match schema" "$RUNNER_TEMP/schema-apply.txt"
          status=$(curl -sS -4 --max-time 30 -o /dev/null -w '%{http_code}' -H "Authorization: ApiKey $DELIVERY_KEY" "$BASE/api/delivery/v1/article/$ARTICLE_ID")
          [ "$status" = 200 ] || { echo "::error::The article published before the second up answered $status"; exit 1; }

      - name: Dump the services and their logs
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --timestamps || true

      - name: Remove the services and their volumes
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          rm -f .env

  # The admin's end-to-end project on the image (admin spec 7): the harness runs the host as a container of it, its commands
  # as one-off containers on a volume of the run, and Chromium against its https port on the loopback address. A case that
  # fails is run once more against the same image (run-with-retry.ps1), and a skipped case fails the job, as one does where
  # Docker does not answer. A manual run with an image runs the published one instead of building it. With an archive, as
  # Publish calls this workflow, the job is left out, so that a release waits for the smoke test only.
  end-to-end:
    name: End-to-end on the image (admin)
    if: ${{ !inputs.archive }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: compose-end-to-end-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
    env:
      BUILDKIT_PROGRESS: plain
      FLUENTCMS_E2E_IMAGE: ${{ inputs.image || 'fluentcms-e2e' }}
      TESTINGPLATFORM_DIAGNOSTIC: 1
      TESTINGPLATFORM_DIAGNOSTIC_VERBOSITY: Information
      TESTINGPLATFORM_DIAGNOSTIC_OUTPUT_DIRECTORY: ${{ github.workspace }}/artifacts/test-results
      TESTINGPLATFORM_DIAGNOSTIC_SYNCHRONOUS_WRITE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the image
        if: ${{ !inputs.image }}
        run: docker build -f src/FluentCMS.Host/Dockerfile -t "$FLUENTCMS_E2E_IMAGE" .

      - name: Pull the published image
        if: ${{ inputs.image }}
        run: docker pull "$FLUENTCMS_E2E_IMAGE"

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Build the tests
        run: dotnet build admin/tests/FluentCMS.Admin.EndToEnd -c Release -warnaserror

      - name: Install Chromium
        run: pwsh admin/tests/FluentCMS.Admin.EndToEnd/bin/Release/net10.0/playwright.ps1 install --only-shell chromium

      - name: Test
        run: pwsh admin/tests/FluentCMS.Admin.EndToEnd/run-with-retry.ps1 -ResultsDirectory artifacts/test-results -Timeout 20m -RetryTimeout 8m

      - name: Name the tests that were running
        if: failure() || cancelled()
        run: grep -h -A6 -e "\[Long Running Test\]" -e "\[FAIL\]" artifacts/test-results/*.diag 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-end-to-end-image
          path: artifacts/test-results
          retention-days: 14

      # The harness removes them itself; this step covers a test process that was killed, as a cancelled run may be.
      - name: Remove the containers, the volume and the certificates of the run
        if: always()
        run: |
          containers=$(docker ps -aq --filter label=org.fluentcms.e2e)
          [ -z "$containers" ] || docker rm -f $containers
          volumes=$(docker volume ls -q --filter label=org.fluentcms.e2e)
          [ -z "$volumes" ] || docker volume rm -f $volumes
          rm -rf "${TMPDIR:-/tmp}"/fluentcms-e2e-*
