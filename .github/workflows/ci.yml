name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  build:
    name: Build and check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore

      # dotnet list exits 0 even when it finds a vulnerable package, so fail on its report.
      - name: Check vulnerable packages
        shell: bash
        run: |
          dotnet list FluentCMS.slnx package --vulnerable --include-transitive | tee "$RUNNER_TEMP/vulnerable-packages.txt"
          if grep -q "has the following vulnerable packages" "$RUNNER_TEMP/vulnerable-packages.txt"; then
            echo "::error::Vulnerable NuGet packages found. Update them in Directory.Packages.props."
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

  test:
    # Each shard builds only its own projects, so the critical path is the slowest shard rather than the whole suite.
    name: Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: units
            projects: tests/FluentCMS.Sdk.Tests tests/FluentCMS.Core.Tests tests/FluentCMS.Architecture.Tests tests/FluentCMS.Generators.Tests
          - group: integration
            projects: tests/FluentCMS.Core.IntegrationTests tests/FluentCMS.Cli.Tests tests/FluentCMS.Client.Tests
          - group: plugins
            projects: tests/FluentCMS.Plugins.Tests tests/FluentCMS.Plugins.Media.Tests tests/FluentCMS.Plugins.Webhooks.Tests tests/FluentCMS.Plugins.Mcp.Tests tests/FluentCMS.Plugins.GraphQL.Tests tests/FluentCMS.Plugins.MultiSite.Tests tests/FluentCMS.Plugins.AiAssist.Tests tests/FluentCMS.Host.Tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      # Run every project of the shard even after one fails, so one run reports all failures.
      - name: Test
        shell: bash
        run: |
          status=0
          for project in ${{ matrix.projects }}; do
            dotnet test --project "$project" -c Release --report-xunit-trx --results-directory artifacts/test-results || status=1
          done
          exit $status

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.group }}
          path: artifacts/test-results
          retention-days: 14

  # @fluentcms/client: its build, and its tests, which compile the module `fluentcms generate typescript` writes for the
  # Blog sample in strict mode. Node is the version the markdown lint action runs on.
  typescript:
    name: TypeScript client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The full suite of the nightly and manual runs takes more than 20 minutes with the client and generate tests.
  build-test-windows:
    name: Build and test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Pull requests and pushes to main run only the fast tests on Windows, because the Linux shards
      # already run the full suite. Only the nightly and manual runs run the full suite on Windows.
      FULL_TESTS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      # xunit.v3 ships its own TRX reporter; --report-trx needs an extra package.
      - name: Test
        if: env.FULL_TESTS == 'true'
        run: dotnet test -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Test SDK
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Sdk.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Test core units
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Core.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Test architecture
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Architecture.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-windows-latest
          path: artifacts/test-results
          retention-days: 14

  data-tests:
    name: Data tests (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The tests start each server in a container through Testcontainers. SQLite and PostgreSQL run in every run. SQL Server
      # 2025 runs on pushes to main, on pull requests from feature/* branches and where FULL_TESTS holds (the nightly and
      # manual runs); SQL Server 2019 runs only where FULL_TESTS holds.
      matrix:
        provider: >-
          ${{ fromJSON(
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["sqlite", "postgresql", "sqlserver-2019", "sqlserver-2025"]'
          || (github.event_name == 'push' || startsWith(github.head_ref, 'feature/')) && '["sqlite", "postgresql", "sqlserver-2025"]'
          || '["sqlite", "postgresql"]') }}
    env:
      FLUENTCMS_TEST_PROVIDER: ${{ matrix.provider }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Test
        run: dotnet test --project tests/FluentCMS.Data.Tests -c Release --report-xunit-trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-data-${{ matrix.provider }}
          path: artifacts/test-results
          retention-days: 14

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Build
        run: dotnet build -c Release

      - name: Check deprecated packages
        continue-on-error: true
        shell: bash
        run: |
          dotnet list FluentCMS.slnx package --deprecated | tee "$RUNNER_TEMP/deprecated-packages.txt"
          if grep -q "has the following deprecated packages" "$RUNNER_TEMP/deprecated-packages.txt"; then
            echo "::warning::Deprecated NuGet packages found. See the Check deprecated packages step."
          fi

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts/packages

      # Packed beside the NuGet packages and, like them, not published.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Pack the TypeScript client
        working-directory: clients/typescript
        run: |
          npm ci
          npm run build
          npm pack --pack-destination ../../artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 7

  # The packages of this build in a folder feed, with a version of the run, and FluentCMS.Templates installed from it: every
  # combination of the templates is created, built with warnings as errors and the plugin's tests run, the SQLite hosts start
  # in Development, and a PostgreSQL host is brought up with `fluentcms migrations add Initial` and `fluentcms migrate`.
  templates:
    name: Templates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # The image of the PostgreSQL data tests (postgres:15.19), as a service of the job.
      postgres:
        image: postgres@sha256:1aac5b49cefd627f02816141ca4ad012d6cc19460dfe02a9b5168a105be3fc53
        env:
          POSTGRES_USER: fluentcms
          POSTGRES_PASSWORD: fluentcms-ci
          POSTGRES_DB: fluentcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluentcms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PACKAGE_VERSION: 1.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Pack to a folder feed
        run: dotnet pack FluentCMS.slnx -c Release -o "$RUNNER_TEMP/feed" -p:Version="$PACKAGE_VERSION"

      - name: Create, build and test every combination
        env:
          FLUENTCMS_TEMPLATES_POSTGRES: Host=localhost;Port=5432;Database=fluentcms;Username=fluentcms;Password=fluentcms-ci
        run: bash templates/test-templates.sh "$RUNNER_TEMP/feed" "$PACKAGE_VERSION" "$RUNNER_TEMP/templates"

      - name: Upload host logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: templates-host-logs
          path: ${{ runner.temp }}/templates/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The compose file of the reference host with its smoke test, on pushes to main and manual runs, not on pull requests or
  # the nightly run. Pushes to feature branches run it from compose.yml itself.
  compose:
    name: Compose
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/compose.yml

  # Nobody watches the nightly run, which is the only one that runs the full Windows suite, so a failure opens an issue.
  nightly-report:
    name: Report nightly failure
    needs: [markdown, build, test, typescript, build-test-windows, data-tests, pack, templates]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the nightly failure issue
        shell: bash
        run: |
          title="Nightly CI failed"
          body="The scheduled CI run failed: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
