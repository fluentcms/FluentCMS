name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  build:
    name: Build and check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore

      # dotnet list exits 0 even when it finds a vulnerable package, so fail on its report.
      - name: Check vulnerable packages
        shell: bash
        run: |
          dotnet list FluentCMS.slnx package --vulnerable --include-transitive | tee "$RUNNER_TEMP/vulnerable-packages.txt"
          if grep -q "has the following vulnerable packages" "$RUNNER_TEMP/vulnerable-packages.txt"; then
            echo "::error::Vulnerable NuGet packages found. Update them in Directory.Packages.props."
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

  test:
    # Each shard builds only its own projects, so the critical path is the slowest shard rather than the whole suite.
    name: Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: units
            projects: tests/FluentCMS.Sdk.Tests tests/FluentCMS.Core.Tests tests/FluentCMS.Architecture.Tests
          - group: integration
            projects: tests/FluentCMS.Core.IntegrationTests
          - group: plugins
            projects: tests/FluentCMS.Plugins.Tests tests/FluentCMS.Plugins.Media.Tests tests/FluentCMS.Plugins.Webhooks.Tests tests/FluentCMS.Plugins.GraphQL.Tests tests/FluentCMS.Host.Tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      # Run every project of the shard even after one fails, so one run reports all failures.
      - name: Test
        shell: bash
        run: |
          status=0
          for project in ${{ matrix.projects }}; do
            dotnet test --project "$project" -c Release --report-xunit-trx --results-directory artifacts/test-results || status=1
          done
          exit $status

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.group }}
          path: artifacts/test-results
          retention-days: 14

  build-test-windows:
    name: Build and test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Pull requests and pushes to main run only the fast tests on Windows, because the Linux shards
      # already run the full suite. Only the nightly and manual runs run the full suite on Windows.
      FULL_TESTS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      # xunit.v3 ships its own TRX reporter; --report-trx needs an extra package.
      - name: Test
        if: env.FULL_TESTS == 'true'
        run: dotnet test -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Test SDK
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Sdk.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Test core units
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Core.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Test architecture
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Architecture.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-windows-latest
          path: artifacts/test-results
          retention-days: 14

  data-tests:
    name: Data tests (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The tests start each server in a container through Testcontainers. SQLite and PostgreSQL run in every run. SQL Server
      # 2025 runs on pushes to main, on pull requests from feature/* branches and where FULL_TESTS holds (the nightly and
      # manual runs); SQL Server 2019 runs only where FULL_TESTS holds.
      matrix:
        provider: >-
          ${{ fromJSON(
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["sqlite", "postgresql", "sqlserver-2019", "sqlserver-2025"]'
          || (github.event_name == 'push' || startsWith(github.head_ref, 'feature/')) && '["sqlite", "postgresql", "sqlserver-2025"]'
          || '["sqlite", "postgresql"]') }}
    env:
      FLUENTCMS_TEST_PROVIDER: ${{ matrix.provider }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Test
        run: dotnet test --project tests/FluentCMS.Data.Tests -c Release --report-xunit-trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-data-${{ matrix.provider }}
          path: artifacts/test-results
          retention-days: 14

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Build
        run: dotnet build -c Release

      - name: Check deprecated packages
        continue-on-error: true
        shell: bash
        run: |
          dotnet list FluentCMS.slnx package --deprecated | tee "$RUNNER_TEMP/deprecated-packages.txt"
          if grep -q "has the following deprecated packages" "$RUNNER_TEMP/deprecated-packages.txt"; then
            echo "::warning::Deprecated NuGet packages found. See the Check deprecated packages step."
          fi

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 7

  # Nobody watches the nightly run, which is the only one that runs the full Windows suite, so a failure opens an issue.
  nightly-report:
    name: Report nightly failure
    needs: [markdown, build, test, build-test-windows, data-tests, pack]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the nightly failure issue
        shell: bash
        run: |
          title="Nightly CI failed"
          body="The scheduled CI run failed: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
