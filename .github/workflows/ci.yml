name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: "**/*.md"

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Issue pull requests run only the fast tests on Windows. Feature-branch pull requests,
      # pushes to main, nightly and manual runs keep the full Windows suite.
      FULL_TESTS: ${{ matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request' || startsWith(github.head_ref, 'feature/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore

      # dotnet list exits 0 even when it finds a vulnerable package, so fail on its report.
      - name: Check vulnerable packages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet list FluentCMS.slnx package --vulnerable --include-transitive | tee "$RUNNER_TEMP/vulnerable-packages.txt"
          if grep -q "has the following vulnerable packages" "$RUNNER_TEMP/vulnerable-packages.txt"; then
            echo "::error::Vulnerable NuGet packages found. Update them in Directory.Packages.props."
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      # xunit.v3 ships its own TRX reporter; --report-trx needs an extra package.
      - name: Test
        if: env.FULL_TESTS == 'true'
        run: dotnet test -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Test SDK
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Sdk.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Test core units
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Core.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Test architecture
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Architecture.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          retention-days: 14

  data-tests:
    name: Data tests (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.preview && 45 || 20 }}
    # A server provider's failures do not fail the run until the suite passes on it (#2711).
    continue-on-error: ${{ matrix.preview == true }}
    strategy:
      fail-fast: false
      matrix:
        provider: [sqlite]
        # The tests start each server in a container through Testcontainers. Remove an entry's preview flag, and so its
        # continue-on-error, once the suite passes on that provider.
        include:
          - provider: postgresql
          - provider: sqlserver-2019
            preview: true
          - provider: sqlserver-2025
            preview: true
    env:
      FLUENTCMS_TEST_PROVIDER: ${{ matrix.provider }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Test
        run: dotnet test --project tests/FluentCMS.Data.Tests -c Release --report-xunit-trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-data-${{ matrix.provider }}
          path: artifacts/test-results
          retention-days: 14

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Build
        run: dotnet build -c Release

      - name: Check deprecated packages
        continue-on-error: true
        shell: bash
        run: |
          dotnet list FluentCMS.slnx package --deprecated | tee "$RUNNER_TEMP/deprecated-packages.txt"
          if grep -q "has the following deprecated packages" "$RUNNER_TEMP/deprecated-packages.txt"; then
            echo "::warning::Deprecated NuGet packages found. See the Check deprecated packages step."
          fi

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 7
