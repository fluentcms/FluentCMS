name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      quick:
        description: Run what a pull request of a feature branch into main runs (the fast tests on Windows, no SQL Server 2019, no Compose), for a check in the middle of a milestone.
        type: boolean
        default: false
      traces:
        description: Keep a masked Playwright trace of each failed end-to-end test in the test results.
        type: boolean
        default: false

permissions:
  contents: read

# A pull request's newer run cancels its older one. Every other run has a group of its own, since a run that waits in a
# group is cancelled by the next one even without cancel-in-progress, and pushes to main and the nightly run must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The diagnostic log of each test app, written as it goes so that it survives a cancelled job, holds xUnit.net's report
# of a test that runs too long and the stack of a test that --timeout cancelled.
env:
  TESTINGPLATFORM_DIAGNOSTIC: 1
  TESTINGPLATFORM_DIAGNOSTIC_VERBOSITY: Information
  TESTINGPLATFORM_DIAGNOSTIC_OUTPUT_DIRECTORY: ${{ github.workspace }}/artifacts/test-results
  TESTINGPLATFORM_DIAGNOSTIC_SYNCHRONOUS_WRITE: 1

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  build:
    name: Build and check (ubuntu-latest)
    needs: plan
    if: needs.plan.outputs.scope != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore

      # dotnet list exits 0 even when it finds a vulnerable package, so fail on its report.
      - name: Check vulnerable packages
        shell: bash
        run: |
          dotnet list FluentCMS.slnx package --vulnerable --include-transitive | tee "$RUNNER_TEMP/vulnerable-packages.txt"
          if grep -q "has the following vulnerable packages" "$RUNNER_TEMP/vulnerable-packages.txt"; then
            echo "::error::Vulnerable NuGet packages found. Update them in Directory.Packages.props."
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

  test:
    # Each shard builds only its own projects, so the critical path is the slowest shard rather than the whole suite.
    name: Tests (${{ matrix.group }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A shard outside the scope of the run passes without steps, so that its required check still reports.
    env:
      RUN_SHARD: ${{ !contains(needs.plan.outputs.skipped-tests, format(' {0} ', matrix.group)) }}
    # The shards come from the test projects of the solution (eng/test-shards.sh), so a new project runs without a change here.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.test-shards) }}
    steps:
      - name: Checkout
        if: env.RUN_SHARD == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        if: env.RUN_SHARD == 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      # Run every project of the shard even after one fails, so one run reports all failures. A project still running after
      # the shard's timeout, well past its slowest healthy project, has hung, and ends with time left to name its tests.
      - name: Test
        if: env.RUN_SHARD == 'true'
        shell: bash
        run: |
          status=0
          for project in ${{ matrix.projects }}; do
            dotnet test --project "$project" -c Release --report-xunit-trx --results-directory artifacts/test-results ${{ matrix.args }} --timeout ${{ matrix.timeout }} || status=1
          done
          exit $status

      - name: Name the tests that were running
        if: failure() || cancelled()
        shell: bash
        run: grep -h -A6 -e "\[Long Running Test\]" -e "\[FAIL\]" artifacts/test-results/*.diag 2>/dev/null || true

      - name: Upload test results
        if: always() && env.RUN_SHARD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.group }}
          path: artifacts/test-results
          retention-days: 14

  # The admin's browser tests (spec 7): the tests publish the reference host and run it, and drive it in Chromium. Chromium is
  # downloaded on every run: it takes seconds, while a cache of it under the NuGet folder cost over 1 GB of the repository's
  # cache quota and made the job no faster.
  end-to-end:
    name: End-to-end (admin)
    needs: plan
    if: needs.plan.outputs.scope != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build admin/tests/FluentCMS.Admin.EndToEnd -c Release -warnaserror

      # The headless shell is what headless Chromium runs. The runner's image holds every system library it needs, so
      # --with-deps is left out: all it added through apt was fonts the tests do not read, and the mirror took up to seven
      # minutes over them in one run of five. A library the image loses fails the launch, and so every browser test.
      - name: Install Chromium
        run: pwsh admin/tests/FluentCMS.Admin.EndToEnd/bin/Release/net10.0/playwright.ps1 install --only-shell chromium

      # A skipped test fails here, so that a browser that did not install cannot pass the job. A failed case is run once more,
      # and one that passes then is named as flaky in the job summary (spec 7). A manual run with traces on keeps the masked
      # trace of each failed test in the uploaded results.
      - name: Test
        env:
          FLUENTCMS_E2E_TRACES: ${{ inputs.traces && format('{0}/artifacts/test-results/traces', github.workspace) || '' }}
        run: pwsh admin/tests/FluentCMS.Admin.EndToEnd/run-with-retry.ps1 -ResultsDirectory artifacts/test-results -Timeout 15m -RetryTimeout 6m

      - name: Name the tests that were running
        if: failure() || cancelled()
        shell: bash
        run: grep -h -A6 -e "\[Long Running Test\]" -e "\[FAIL\]" artifacts/test-results/*.diag 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-end-to-end
          path: artifacts/test-results
          retention-days: 14

  # @fluentcms/client: its build, and its tests, which compile the module `fluentcms generate typescript` writes for the
  # Blog sample in strict mode. Node is the version the markdown lint action runs on.
  typescript:
    name: TypeScript client
    needs: plan
    if: needs.plan.outputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The rich text editor's bundle (admin spec AQ7): the schema's round trip test, and a rebuild from the lockfile that must
  # give the committed rich-text.js byte for byte, so that dotnet build and the image never need Node.
  rich-text:
    name: Rich text bundle
    needs: plan
    if: needs.plan.outputs.scope != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin/src/FluentCMS.Admin.RichText/js
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/src/FluentCMS.Admin.RichText/js/package-lock.json

      - name: Install
        run: npm ci

      - name: Test the schema
        run: npm test

      - name: Rebuild the bundle
        run: npm run build

      - name: Check that the committed bundle is the rebuild
        shell: bash
        run: |
          if ! git diff --exit-code --stat -- ../wwwroot || [ -n "$(git status --porcelain -- ../wwwroot)" ]; then
            git status --porcelain -- ../wwwroot
            echo "::error::The committed rich text bundle differs from a rebuild. Run npm ci and npm run build in admin/src/FluentCMS.Admin.RichText/js and commit wwwroot/rich-text.js."
            exit 1
          fi

  # The full suite of the nightly and manual runs takes more than 20 minutes with the client and generate tests, and 26 to 28
  # minutes with the admin's end-to-end tests.
  build-test-windows:
    name: Build and test (windows-latest)
    needs: plan
    if: needs.plan.outputs.scope != 'docs'
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      # Pull requests, pushes to main and quick manual runs run only the fast tests on Windows, because the Linux shards
      # already run the full suite. Only the nightly and the other manual runs run the full suite on Windows.
      FULL_TESTS: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.quick) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      # xunit.v3 ships its own TRX reporter; --report-trx needs an extra package. Each --timeout is well past the slowest
      # healthy run of its tests, so a hang ends with time left to name its tests. It counts from the start of each test app,
      # and in the full run the last app has started up to 21 minutes into the job (17m57s and 21m15s with the admin's end-to-end
      # tests, whose host publish waits behind the others), so the job's 50 minutes leave room for that app's 25.
      - name: Test
        if: env.FULL_TESTS == 'true'
        run: dotnet test -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results --timeout 25m

      - name: Test SDK
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Sdk.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results --timeout 10m

      - name: Test core units
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Core.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results --timeout 10m

      - name: Test architecture
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Architecture.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results --timeout 10m

      - name: Test admin components
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project admin/tests/FluentCMS.Admin.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results --timeout 10m

      # As in the fast checks of Feature CI: the tool, and the host's commands with export and import on SQLite.
      - name: Test the tool
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Cli.Tests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results --timeout 10m

      # A minimum keeps a filter that matches too little from passing.
      - name: Test the commands
        if: env.FULL_TESTS != 'true'
        run: dotnet test --project tests/FluentCMS.Core.IntegrationTests -c Release --no-build --report-xunit-trx --results-directory artifacts/test-results --filter-namespace "FluentCMS.Core.IntegrationTests.Commands*" --minimum-expected-tests 40 --timeout 10m

      - name: Name the tests that were running
        if: failure() || cancelled()
        shell: bash
        run: grep -h -A6 -e "\[Long Running Test\]" -e "\[FAIL\]" artifacts/test-results/*.diag 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-windows-latest
          path: artifacts/test-results
          retention-days: 14

  # The shards of the data tests. SQLite and PostgreSQL run in every run. SQL Server 2025 runs on pushes to main, on pull
  # requests from feature/* branches, on pull requests that change a data provider, a migration or the data tests, and on
  # the nightly and manual runs; SQL Server 2019 runs only on the nightly and on manual runs that are not quick. The
  # servers run in two shards.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      skipped-tests: ${{ steps.scope.outputs.skipped-tests }}
      test-shards: ${{ steps.test-shards.outputs.matrix }}
      data-tests: ${{ steps.data-tests.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The scope of a pull request, from its changed files: `docs` when each is markdown under docs/ that no test, script
      # or project names, `admin` when each is under admin/ or such markdown, and `all` otherwise and for every other
      # event. A backend change stays `all`, because the admin's API and end-to-end tests read the reference host. In the
      # `admin` scope the units shard still runs for the architecture rules and plugins-1 for the host's admin tests.
      - name: Choose the scope of the run
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          : > "$RUNNER_TEMP/changed-files.txt"
          scope=all
          if [ "$EVENT" = pull_request ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
            scope=docs
            while IFS= read -r file; do
              case "$file" in
                docs/*.md)
                  if git grep -qF -e "$(basename "$file")" -- '*.cs' '*.csproj' '*.props' '*.targets' '*.sh' '*.ps1'; then
                    scope=all
                  fi ;;
                admin/*)
                  if [ "$scope" = docs ]; then
                    scope=admin
                  fi ;;
                *)
                  scope=all ;;
              esac
            done < "$RUNNER_TEMP/changed-files.txt"
          fi
          case "$scope" in
            docs) skipped=" units integration-1 integration-2 plugins-1 plugins-2 admin " ;;
            admin) skipped=" integration-1 integration-2 plugins-2 " ;;
            *) skipped="" ;;
          esac
          echo "scope=$scope" | tee -a "$GITHUB_OUTPUT"
          echo "skipped-tests=$skipped" | tee -a "$GITHUB_OUTPUT"

      # Fails when a test project of the solution is in no shard, or an npm project is tested by no job.
      - name: Choose the shards of the tests
        id: test-shards
        shell: bash
        run: |
          matrix=$(bash eng/test-shards.sh)
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

      # Outside the `all` scope the SQLite shard alone is listed, without steps, so that its required check still reports.
      - name: Choose the shards of the data tests
        id: data-tests
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          QUICK: ${{ inputs.quick }}
        run: |
          if [ "$SCOPE" != all ]; then
            echo 'matrix=[{"shard":"sqlite","provider":"sqlite","skip":true}]' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          servers="postgresql"
          case "$EVENT" in
            schedule | workflow_dispatch)
              if [ "$QUICK" != true ]; then
                servers+=" sqlserver-2019"
              fi
              servers+=" sqlserver-2025" ;;
            push)
              servers+=" sqlserver-2025" ;;
            pull_request)
              if [[ "$HEAD_REF" == feature/* ]] || grep -qE '^src/FluentCMS\.Data\.|/Migrations/|^tests/FluentCMS\.Data\.Tests/' "$RUNNER_TEMP/changed-files.txt"; then
                servers+=" sqlserver-2025"
              fi ;;
          esac
          shards='{"shard":"sqlite","provider":"sqlite"}'
          for server in $servers; do
            for part in 1 2; do
              shards+=",{\"shard\":\"$server-$part\",\"provider\":\"$server\",\"part\":$part}"
            done
          done
          echo "matrix=[$shards]" | tee -a "$GITHUB_OUTPUT"

  data-tests:
    name: Data tests (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    # A hung run has outlived the timeout of dotnet test, so the job's own limit is what ends it: 15 minutes where a
    # healthy shard takes 4 to 7, and 25 on SQL Server, where one takes up to 11.
    timeout-minutes: ${{ startsWith(matrix.provider, 'sqlserver') && 25 || 15 }}
    strategy:
      fail-fast: false
      # The tests start each server in a container through Testcontainers.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.data-tests) }}
    env:
      FLUENTCMS_TEST_PROVIDER: ${{ matrix.provider }}
    steps:
      - name: Checkout
        if: ${{ !matrix.skip }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        if: ${{ !matrix.skip }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      # The first shard of a server runs these namespaces and the second every other, so a new namespace runs without a
      # change here. On SQL Server the two took a median of 7.4 and 7.7 minutes over 87 runs; one run does not show the
      # balance, since a runner may be half as fast as the one beside it. A minimum keeps a filter that matches nothing
      # from passing. The timeout is well past the slowest healthy run of the provider, so that a hang ends with time left
      # to name its tests.
      - name: Test
        if: ${{ !matrix.skip }}
        shell: bash
        run: |
          namespaces=("FluentCMS.Data.Tests.Content*" "FluentCMS.Data.Tests.Jobs*" "FluentCMS.Data.Tests.Events*")
          case "${{ matrix.part }}" in
            1) filter=(--filter-namespace "${namespaces[@]}" --minimum-expected-tests 700) ;;
            2) filter=(--filter-not-namespace "${namespaces[@]}" --minimum-expected-tests 1000) ;;
            *) filter=() ;;
          esac
          case "${{ matrix.provider }}" in
            sqlserver-*) timeout=20m ;;
            *) timeout=10m ;;
          esac
          dotnet test --project tests/FluentCMS.Data.Tests -c Release --report-xunit-trx --results-directory artifacts/test-results "${filter[@]}" --timeout "$timeout"

      - name: Name the tests that were running
        if: failure() || cancelled()
        shell: bash
        run: grep -h -A6 -e "\[Long Running Test\]" -e "\[FAIL\]" artifacts/test-results/*.diag 2>/dev/null || true

      - name: Upload test results
        if: ${{ always() && !matrix.skip }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-data-${{ matrix.shard }}
          path: artifacts/test-results
          retention-days: 14

  # Branch protection on main requires these names, which were jobs before they were split into shards. Each passes only
  # when every shard of the tests and of the data tests passed, SQL Server among them where it ran. A job that waits for
  # a failed plan is skipped, which branch protection takes for a pass, so a failed plan fails here.
  required:
    name: ${{ matrix.check }}
    needs: [plan, test, data-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        check: ["Tests (integration)", "Tests (plugins)", "Data tests (postgresql)"]
    steps:
      - name: Check the shards
        shell: bash
        run: test "${{ needs.plan.result }}" = success && test "${{ needs.test.result }}" = success && test "${{ needs.data-tests.result }}" = success

  pack:
    name: Pack
    needs: plan
    if: needs.plan.outputs.scope != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Build
        run: dotnet build -c Release

      # The version prefix of Directory.Build.props with the suffix of this run, which no release has.
      - name: Read the version of this build
        shell: bash
        run: |
          version=$(dotnet msbuild src/FluentCMS.Sdk/FluentCMS.Sdk.csproj -getProperty:Version | tail -n 1)
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check deprecated packages
        continue-on-error: true
        shell: bash
        run: |
          dotnet list FluentCMS.slnx package --deprecated | tee "$RUNNER_TEMP/deprecated-packages.txt"
          if grep -q "has the following deprecated packages" "$RUNNER_TEMP/deprecated-packages.txt"; then
            echo "::warning::Deprecated NuGet packages found. See the Check deprecated packages step."
          fi

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts/packages

      # The admin app is the prebuilt static build, not a package. A trim warning in a FluentCMS assembly fails the publish.
      - name: Publish the admin trimmed
        run: dotnet publish admin/src/FluentCMS.Admin.App -c Release --no-build -o artifacts/admin

      # The licence and the third-party notices travel with the compiled code (#3215).
      - name: Check that the admin app holds the Blazor script and the notices
        shell: bash
        run: |
          test -f artifacts/admin/wwwroot/_framework/blazor.webassembly.js
          cmp LICENSE artifacts/admin/wwwroot/LICENSE
          cmp THIRD-PARTY-NOTICES.md artifacts/admin/wwwroot/THIRD-PARTY-NOTICES.md

      # Admin spec 7: the Brotli size of the first download, without lazy assemblies. The budget was set in #3144 from a
      # measurement of 3,226,834 B and raised in #3346 at 3,499,922 B, and kept in #3354 at 3,561,801 B from the table of the
      # first download by part; raise it on purpose, in the specification too, never to let a build through.
      - name: Check the download size of the admin
        run: dotnet run eng/check-admin-size.cs -- artifacts/admin 3600000

      - name: Check that a download above the budget fails the check
        shell: bash
        run: |
          if dotnet run eng/check-admin-size.cs -- artifacts/admin 1000000 > "$RUNNER_TEMP/admin-size.log"; then
            cat "$RUNNER_TEMP/admin-size.log"
            echo "::error::The size check passed the admin with a budget of 1,000,000 B."
            exit 1
          fi
          grep -q "over the budget" "$RUNNER_TEMP/admin-size.log" || { cat "$RUNNER_TEMP/admin-size.log"; echo "::error::The size check did not say by how much the admin is over."; exit 1; }
          echo "Above the budget, the admin fails the check, as expected."

      # The prebuilt static build of the admin (admin spec 6.3), made and checked as the Publish workflow makes it for a release,
      # and uploaded with the packages.
      - name: Make the static build of the admin
        run: dotnet run eng/admin-zip.cs -- pack artifacts/admin "$PACKAGE_VERSION" artifacts/packages

      # A copy of the zip without each file the check asks for, and one with a compressed copy of index.html or config.json,
      # which the check must refuse and name.
      - name: Check that a static build without a file or with a compressed document fails the check
        shell: bash
        run: |
          built="$PWD/artifacts/packages/fluentcms-admin-$PACKAGE_VERSION.zip"
          broken="$RUNNER_TEMP/broken-admin"
          mkdir -p "$broken"
          for name in index.html config.json _framework/blazor.webassembly.js LICENSE THIRD-PARTY-NOTICES.md README.txt index.html.br config.json.gz; do
            cp "$built" "$broken/build.zip"
            case "$name" in
              *.br | *.gz) (cd "$broken" && echo stale > "$name" && zip -q build.zip "$name" && rm "$name"); expected="holds $name" ;;
              *) zip -q -d "$broken/build.zip" "$name"; expected="misses $name" ;;
            esac
            if dotnet run eng/admin-zip.cs -- check "$broken/build.zip" > "$broken/build.log"; then
              cat "$broken/build.log"
              echo "::error::The check passed a static build that $expected."
              exit 1
            fi
            grep -qF "$expected" "$broken/build.log" || { cat "$broken/build.log"; echo "::error::The check did not say that the static build $expected."; exit 1; }
            echo "A static build that $expected fails the check, as expected."
          done

      # Packed beside the NuGet packages at their version. CI publishes neither; the Publish workflow does, from a tag.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Pack the TypeScript client
        working-directory: clients/typescript
        run: |
          npm version "$PACKAGE_VERSION" --no-git-tag-version --allow-same-version
          npm ci
          npm run build
          npm pack --pack-destination ../../artifacts/packages

      - name: Check the metadata of the packages
        run: dotnet run eng/check-packages.cs -- artifacts/packages "$PACKAGE_VERSION"

      # A copy of FluentCMS.Sdk without each part in turn, which the check must refuse and name: an element of its .nuspec, or
      # SourceLink, with the symbols package left out.
      - name: Check that a package without a part fails the check
        shell: bash
        run: |
          declare -A expected=([description]="a description" [readme]="a README" [tags]="its tags" [icon]="the icon" [license]="the licence expression MIT" [sourcelink]="SourceLink in the PDB")
          for part in "${!expected[@]}"; do
            broken="$RUNNER_TEMP/broken-package/$part"
            mkdir -p "$broken"
            cp "artifacts/packages/FluentCMS.Sdk.$PACKAGE_VERSION.nupkg" "$broken/"
            if [ "$part" != sourcelink ]; then
              cp "artifacts/packages/FluentCMS.Sdk.$PACKAGE_VERSION.snupkg" "$broken/"
              (cd "$broken" && unzip -q "FluentCMS.Sdk.$PACKAGE_VERSION.nupkg" FluentCMS.Sdk.nuspec \
                && sed -i -E "s#<$part( [^>]*)?>[^<]*</$part>##" FluentCMS.Sdk.nuspec \
                && zip -q "FluentCMS.Sdk.$PACKAGE_VERSION.nupkg" FluentCMS.Sdk.nuspec && rm FluentCMS.Sdk.nuspec)
            fi
            if dotnet run eng/check-packages.cs -- "$broken" "$PACKAGE_VERSION" > "$broken.log"; then
              cat "$broken.log"
              echo "::error::The check passed FluentCMS.Sdk without its $part."
              exit 1
            fi
            grep -q "misses ${expected[$part]}" "$broken.log" || { cat "$broken.log"; echo "::error::The check did not name the missing $part."; exit 1; }
            echo "Without its $part, FluentCMS.Sdk fails the check, as expected."
          done

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 7

  # The packages of this build in a folder feed, at the version of the run, and FluentCMS.Templates installed from it: every
  # combination of the templates is created, built with warnings as errors and the plugin's tests run, the SQLite hosts start
  # in Development, and a PostgreSQL host is brought up with `fluentcms migrations add Initial` and `fluentcms migrate`.
  templates:
    name: Templates
    needs: plan
    if: needs.plan.outputs.scope != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # The image of the PostgreSQL data tests (postgres:15.19), as a service of the job.
      postgres:
        image: postgres@sha256:1aac5b49cefd627f02816141ca4ad012d6cc19460dfe02a9b5168a105be3fc53
        env:
          POSTGRES_USER: fluentcms
          POSTGRES_PASSWORD: fluentcms-ci
          POSTGRES_DB: fluentcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluentcms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Read the version of this build
        shell: bash
        run: |
          version=$(dotnet msbuild src/FluentCMS.Sdk/FluentCMS.Sdk.csproj -getProperty:Version | tail -n 1)
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Pack to a folder feed
        run: dotnet pack FluentCMS.slnx -c Release -o "$RUNNER_TEMP/feed"

      - name: Create, build and test every combination
        env:
          FLUENTCMS_TEMPLATES_POSTGRES: Host=localhost;Port=5432;Database=fluentcms;Username=fluentcms;Password=fluentcms-ci
        run: bash templates/test-templates.sh "$RUNNER_TEMP/feed" "$PACKAGE_VERSION" "$RUNNER_TEMP/templates"

      - name: Upload host logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: templates-host-logs
          path: ${{ runner.temp }}/templates/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The compose file of the reference host with its smoke test, and the admin's end-to-end tests on the image, on pushes to
  # main and manual runs that are not quick, not on pull requests or the nightly run. Pushes to feature branches run it from compose.yml itself.
  compose:
    name: Compose
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.quick)
    uses: ./.github/workflows/compose.yml

  # The M6 sequence from packages on clean Linux and Windows runners (eng/fresh-machine.ps1), on pushes to main, manual runs and
  # the pull request of a feature branch into main, not on issue pull requests or the nightly run. Pushes to feature branches
  # run it from fresh-machine.yml itself.
  fresh-machine:
    name: Fresh machine
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feature/')
    uses: ./.github/workflows/fresh-machine.yml

  # Nobody watches the nightly run, which is the only one that runs the full Windows suite, so a failure or a cancellation
  # opens an issue.
  nightly-report:
    name: Report nightly failure
    needs: [markdown, build, test, end-to-end, typescript, rich-text, build-test-windows, plan, data-tests, pack, templates]
    if: (failure() || cancelled()) && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the nightly failure issue
        shell: bash
        run: |
          title="Nightly CI failed"
          body="The scheduled CI run failed or was cancelled: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
