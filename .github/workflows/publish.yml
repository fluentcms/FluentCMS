name: Publish

# A release, from a tag v* on main (docs/releasing.md): every package of the solution at the version of the tag, pushed with
# its symbols to nuget.org; the image of the reference host for linux/amd64 and linux/arm64, pushed to ghcr.io/fluentcms/fluentcms
# with the version and preview (latest for a release that is not a preview); @fluentcms/client on npm when the repository
# variable NPM_SCOPE_OWNED is true, attached to the GitHub release otherwise; and the GitHub release, a pre-release for a
# preview. It refuses a tag that is not on main, a commit without a successful CI and Fresh machine, and a version that the
# version prefix of Directory.Build.props does not lead to. The image is built once, into an archive of the run that the
# Compose smoke test loads and runs, and the publish job pushes that archive and checks that the registry holds the digest the
# smoke test ran. Only the publish job holds credentials: it runs in the release environment, after its reviewer approves, and
# signs in to nuget.org with trusted publishing.
#
# A manual run, and a pull request that changes the packaging, is a dry run: it checks, packs and builds what a release would,
# runs the smoke test on the image, lists what it would push, and pushes nothing. A pull request runs with no environment and no secret.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to rehearse, such as v1.0.0-preview.1. Blank for the version of this build.
        type: string
        default: ""
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - Directory.Build.props
      - eng/check-packages.cs
      - "src/**/*.csproj"
      - "admin/src/**/*.csproj"
      - src/FluentCMS.Host/Dockerfile
      - .dockerignore
      - .github/workflows/compose.yml
      - eng/load-image.sh
      - nuget.config
      - templates/FluentCMS.Templates.csproj
      - clients/typescript/package.json

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/fluentcms/fluentcms
  PLATFORMS: linux/amd64,linux/arm64
  DOTNET_NOLOGO: "1"

jobs:
  check:
    name: Check the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      preview: ${{ steps.release.outputs.preview }}
      dry-run: ${{ steps.release.outputs.dry-run }}
      tags: ${{ steps.release.outputs.tags }}
      channel: ${{ steps.release.outputs.channel }}
      npm-tag: ${{ steps.release.outputs.npm-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      # A release stops at a refusal of its commit. A dry run reports it as a warning and goes on, so that it still lists what
      # a release would push; a pull request is no release of its commit, so it skips those checks.
      - name: Check the tag, the commit and its runs
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          dry_run=true
          if [ "$EVENT" = push ]; then dry_run=false; fi
          refused=false
          refuse() {
            if [ "$dry_run" = true ]; then echo "::warning::A release would be refused: $1"; else echo "::error::$1"; fi
            echo "- Refused: $1" >> "$GITHUB_STEP_SUMMARY"
            refused=true
          }

          prefix=$(dotnet msbuild src/FluentCMS.Sdk/FluentCMS.Sdk.csproj -getProperty:VersionPrefix | tail -n 1)
          if [ -n "$TAG" ]; then
            if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]; then
              echo "::error::$TAG is not v and a version, such as v1.0.0 or v1.0.0-preview.1."
              exit 1
            fi
            if [ "${BASH_REMATCH[1]}" != "$prefix" ]; then
              echo "::error::$TAG is a version of ${BASH_REMATCH[1]}, and Directory.Build.props holds the version prefix $prefix."
              exit 1
            fi
            case "${BASH_REMATCH[3],,}" in
              ci | ci.* | dev | dev.* | fresh | fresh.*)
                echo "::error::The pre-release ${BASH_REMATCH[3]} is for the builds that are not releases."
                exit 1
                ;;
            esac
            version=${TAG#v}
            if [ ! -s "docs/releases/$version.md" ]; then refuse "the release notes docs/releases/$version.md are missing"; fi
            if gh release view "$TAG" > /dev/null 2>&1; then refuse "the GitHub release $TAG exists already"; fi
          else
            version=$(dotnet msbuild src/FluentCMS.Sdk/FluentCMS.Sdk.csproj -getProperty:Version | tail -n 1)
          fi

          # The commit the tag or the branch names; for a pull request, the commit of its merge.
          commit=$(git rev-parse HEAD)
          if [ "$EVENT" = pull_request ]; then
            echo "A pull request: whether the commit is on main and its CI and Fresh machine passed is checked for a tag."
          else
            if git merge-base --is-ancestor "$commit" origin/main; then
              echo "- The commit $commit is on main." >> "$GITHUB_STEP_SUMMARY"
            else
              refuse "$commit is not on main"
            fi

            # The runs that tested the packages of this commit: CI, which calls Fresh machine, and Fresh machine on a push or
            # a manual run without a feed. A run with a feed tested packages published before, under names of its own.
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$commit&status=success&per_page=100" --jq '.workflow_runs[]
              | select((.path | startswith(".github/workflows/ci.yml"))
                  or ((.path | startswith(".github/workflows/fresh-machine.yml")) and (.display_title | startswith("Fresh machine of the published") | not)))
              | "\(.id) \(.path)"')
            echo "Successful runs of $commit:"
            echo "$runs"
            if ! grep -q ' \.github/workflows/ci\.yml' <<< "$runs"; then refuse "$commit has no successful run of CI"; fi
            jobs=""
            while read -r id _; do
              if [ -n "$id" ]; then
                jobs+=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "success") | .name')$'\n'
              fi
            done <<< "$runs"
            for os in ubuntu-latest windows-latest; do
              if ! grep -qF "Fresh machine ($os" <<< "$jobs"; then refuse "$commit has no successful Fresh machine job on $os"; fi
            done

            # The release environment with a required reviewer, before any job names it: GitHub would make a missing one with
            # no reviewer, and its deployments limited to the tags v*. Both endpoints need the same access, so either one that
            # cannot be read refuses.
            if environment=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" 2> /dev/null); then
              reviewers=$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' <<< "$environment")
              if [ "$reviewers" -lt 1 ]; then refuse "the release environment has no required reviewer"; fi
              if [ "$(jq -r '.deployment_branch_policy.custom_branch_policies // false' <<< "$environment")" != true ]; then
                refuse "the release environment does not limit its deployments to the tags v*"
              elif policies=$(gh api "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies" \
                  --jq '[.branch_policies[] | "\(.type) \(.name)"] | join(", ")' 2> /dev/null); then
                if [ "$policies" != "tag v*" ]; then refuse "the release environment deploys to $policies, not the tags v* only"; fi
              else
                refuse "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies cannot be read, so the deployments of the release environment cannot be checked"
              fi
            else
              refuse "repos/$GITHUB_REPOSITORY/environments/release cannot be read: the release environment does not exist, or the token cannot read it"
            fi
          fi

          preview=false
          if [[ "$version" == *-* ]]; then preview=true; fi
          channel=latest npm_tag=latest
          if [ "$preview" = true ]; then channel=preview npm_tag=next; fi
          {
            echo "version=$version"
            echo "tag=$TAG"
            echo "preview=$preview"
            echo "dry-run=$dry_run"
            echo "tags=$IMAGE:$version $IMAGE:$channel"
            echo "channel=$IMAGE:$channel"
            echo "npm-tag=$npm_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, preview $preview, dry run $dry_run, commit $commit." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$dry_run" = false ] && [ "$refused" = true ]; then exit 1; fi

  pack:
    name: Pack
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Pack
        run: dotnet pack FluentCMS.slnx -c Release -o artifacts/packages -p:Version="$VERSION"

      # The admin is not part of a release yet, so its stub packages are packed but never pushed. A-47 removes this step.
      - name: Leave out the admin packages
        shell: bash
        run: rm -f artifacts/packages/FluentCMS.Admin*.nupkg artifacts/packages/FluentCMS.Admin*.snupkg

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Pack @fluentcms/client
        working-directory: clients/typescript
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm ci
          npm run build
          npm pack --pack-destination ../../artifacts/packages

      - name: Check the metadata of the packages
        run: dotnet run eng/check-packages.cs -- artifacts/packages "$VERSION"

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 30

  # The Dockerfile compiles on the build platform for each target, so no emulation is needed for linux/arm64. The image is built
  # once, into an OCI archive of both platforms that the smoke test and the publish job load; reference names it by digest.
  image:
    name: Image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    outputs:
      reference: ${{ steps.build.outputs.reference }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up a builder for both platforms
        run: docker buildx create --name fluentcms --driver docker-container --use --bootstrap

      - name: Build for linux/amd64 and linux/arm64
        id: build
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          docker buildx build --file src/FluentCMS.Host/Dockerfile --platform "$PLATFORMS" --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.version="$VERSION" --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --output "type=oci,dest=$RUNNER_TEMP/image/image.tar,name=$IMAGE:$VERSION" --metadata-file "$RUNNER_TEMP/build.json" .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The build named no digest of the image: $digest"
            exit 1
          fi
          echo "reference=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "The image $IMAGE:$VERSION is $digest." | tee -a "$GITHUB_STEP_SUMMARY"

      # Kept as long as a release may wait for its approval and be rerun, a dry run's for a day. The layers are compressed already.
      - name: Upload the image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image
          path: ${{ runner.temp }}/image/image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ needs.check.outputs.dry-run == 'true' && 1 || 30 }}

  # The smoke test of compose.yml on the image of the archive, with no credential: the publish job pushes this digest only.
  smoke:
    name: Compose
    needs: [check, image]
    permissions:
      contents: read
    uses: ./.github/workflows/compose.yml
    with:
      image: ${{ needs.image.outputs.reference }}
      archive: image

  list:
    name: What a release pushes
    needs: [check, pack, image, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      TAGS: ${{ needs.check.outputs.tags }}
      PREVIEW: ${{ needs.check.outputs.preview }}
      DRY_RUN: ${{ needs.check.outputs.dry-run }}
      NPM_TAG: ${{ needs.check.outputs.npm-tag }}
      NPM: ${{ vars.NPM_SCOPE_OWNED == 'true' }}
      TESTED: ${{ needs.smoke.outputs.digest }}
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages

      - name: List what a release pushes
        shell: bash
        run: |
          {
            if [ "$DRY_RUN" = true ]; then echo "## Dry run of $VERSION: nothing is pushed"; else echo "## Release $TAG"; fi
            echo
            echo "nuget.org, each package with its symbols:"
            echo
            for package in artifacts/packages/*.nupkg; do
              name=$(basename "$package" ".$VERSION.nupkg")
              if [ -f "artifacts/packages/$name.$VERSION.snupkg" ]; then symbols=", symbols"; else symbols=""; fi
              echo "- $name $VERSION$symbols"
            done
            echo
            for client in artifacts/packages/*.tgz; do
              if [ "$NPM" = true ]; then
                echo "npm: @fluentcms/client $VERSION with the dist-tag $NPM_TAG ($(basename "$client"))"
              else
                echo "The GitHub release: $(basename "$client"), since NPM_SCOPE_OWNED is not true"
              fi
            done
            echo
            echo "ghcr.io, for $PLATFORMS, the image the Compose smoke test ran, $TESTED:"
            echo
            echo "- $IMAGE:candidate-$GITHUB_RUN_ID, which names this run and is read back before the version is written"
            for tag in $TAGS; do echo "- $tag"; done
            echo
            if [ "$PREVIEW" = true ]; then kind="a pre-release"; else kind="a release"; fi
            echo "GitHub: ${TAG:-v$VERSION} as $kind, with the notes of docs/releases/$VERSION.md"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Only this job holds credentials, in the release environment, and it runs for a tag after the environment's reviewer approves.
  # The image goes first at its version: a package on nuget.org can be unlisted but never deleted. The channel tag moves last,
  # so that a failed push leaves it on the release before. The image is the archive the smoke test ran, never built again.
  publish:
    name: Publish
    needs: [check, pack, image, smoke, list]
    if: github.event_name == 'push' && needs.check.outputs.dry-run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CHANNEL: ${{ needs.check.outputs.channel }}
      NPM_TAG: ${{ needs.check.outputs.npm-tag }}
      REFERENCE: ${{ needs.image.outputs.reference }}
      TESTED: ${{ needs.smoke.outputs.digest }}
    steps:
      # The check job refused a release environment without a reviewer; this stops before any push when it has no secret.
      - name: Check the release environment
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::The release environment has no secret NUGET_USER; set it up as docs/releasing.md says."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Download the image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image

      # Before the sign-in: the load may restart Docker.
      - name: Load the image the smoke test ran
        run: |
          if [ "${REFERENCE##*@}" != "$TESTED" ]; then
            echo "::error::The archive holds $REFERENCE, and the smoke test ran $TESTED."
            exit 1
          fi
          eng/load-image.sh "$RUNNER_TEMP/image/image.tar" "$REFERENCE"
          docker tag "$REFERENCE" "$IMAGE:candidate-$GITHUB_RUN_ID"

      - name: Sign in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # A version is never pushed twice with another image: a rerun of the failed jobs pushes the same archive, which the
      # registry holds already, and a run that built the image again stops here. The archive goes up under candidate-{run id},
      # a tag no user pulls, and the version tag is written only once the registry is read back with the tested digest there.
      - name: Push the image at its version
        shell: bash
        run: |
          candidate="$IMAGE:candidate-$GITHUB_RUN_ID"
          registry_digest() {
            if docker buildx imagetools inspect --raw "$1" > "$RUNNER_TEMP/manifest.json" 2> "$RUNNER_TEMP/inspect.txt"; then
              echo "sha256:$(sha256sum < "$RUNNER_TEMP/manifest.json" | cut -d ' ' -f 1)"
            elif grep -qiE 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/inspect.txt"; then
              return 1
            else
              cat "$RUNNER_TEMP/inspect.txt" >&2
              return 2
            fi
          }
          status=0
          held=$(registry_digest "$IMAGE:$VERSION") || status=$?
          case $status in
            0)
              if [ "$held" != "$TESTED" ]; then
                echo "::error::$IMAGE:$VERSION holds $held already, and this run tested $TESTED. A version is never pushed again with another image, so release the next version."
                exit 1
              fi
              echo "$IMAGE:$VERSION holds $TESTED already, so it is not pushed again."
              ;;
            1)
              loaded=$(docker image inspect --format '{{.Id}}' "$candidate" 2> /dev/null || true)
              if [ "$loaded" != "$TESTED" ]; then
                echo "::error::$candidate is ${loaded:-not} in Docker, and the smoke test ran $TESTED."
                exit 1
              fi
              docker push "$candidate"
              pushed=$(registry_digest "$candidate") || true
              if [ "$pushed" != "$TESTED" ]; then
                echo "::error::The registry holds ${pushed:-nothing that can be read} at $candidate, and the smoke test ran $TESTED. $IMAGE:$VERSION is not written."
                exit 1
              fi
              docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$TESTED"
              ;;
            *)
              echo "::error::$IMAGE:$VERSION cannot be read from the registry, so whether it is there already is not known."
              exit 1
              ;;
          esac
          pushed=$(registry_digest "$IMAGE:$VERSION") || true
          if [ "$pushed" != "$TESTED" ]; then
            echo "::error::The registry holds ${pushed:-nothing that can be read} at $IMAGE:$VERSION, and the smoke test ran $TESTED."
            exit 1
          fi
          echo "$IMAGE:$VERSION is $pushed, the image the smoke test ran." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages

      # Trusted publishing: a key of one hour for the policy of this workflow and environment, not a stored one.
      - name: Sign in to nuget.org
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # dotnet nuget push pushes the .snupkg beside each package to the symbol server; a rerun skips what is there already.
      - name: Push the packages and their symbols to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Set up Node for npm
        if: vars.NPM_SCOPE_OWNED == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing once npm has a policy for this workflow; NPM_TOKEN of the environment for the first publish. A rerun
      # skips a version that is there already, as nuget.org does.
      - name: Publish @fluentcms/client to npm
        if: vars.NPM_SCOPE_OWNED == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$(npm view "@fluentcms/client@$VERSION" version 2> /dev/null)" ]; then
            echo "@fluentcms/client $VERSION is on npm already."
          else
            npm publish "artifacts/packages/fluentcms-client-$VERSION.tgz" --access public --tag "$NPM_TAG" --provenance
          fi

      # A copy of the index the version holds, by its digest, so that the channel names the same digest.
      - name: Move the channel tag of the image
        shell: bash
        run: |
          docker buildx imagetools create --tag "$CHANNEL" "$IMAGE@$TESTED"
          docker buildx imagetools inspect --raw "$CHANNEL" > "$RUNNER_TEMP/channel.json"
          moved="sha256:$(sha256sum < "$RUNNER_TEMP/channel.json" | cut -d ' ' -f 1)"
          if [ "$moved" != "$TESTED" ]; then
            echo "::error::$CHANNEL is $moved, not $TESTED."
            exit 1
          fi
          echo "$CHANNEL is $moved." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sign out of ghcr.io
        if: always()
        run: docker logout ghcr.io

  release:
    name: GitHub release
    needs: [check, publish]
    if: github.event_name == 'push' && needs.check.outputs.dry-run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      PREVIEW: ${{ needs.check.outputs.preview }}
      NPM: ${{ vars.NPM_SCOPE_OWNED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages

      - name: Make the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=(--verify-tag --title "FluentCMS $VERSION" --notes-file "docs/releases/$VERSION.md")
          if [ "$PREVIEW" = true ]; then options+=(--prerelease); fi
          if [ "$NPM" != true ]; then options+=("artifacts/packages/fluentcms-client-$VERSION.tgz"); fi
          gh release create "$TAG" "${options[@]}"
